      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

        &lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Ens fixem en…&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Experiment 1&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Experiment 3&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&lt;span class=&quot;key ind&quot;&gt;Què canvia?&lt;/span&gt;&lt;/th&gt;&lt;td&gt;Massa, forma, mida i material. Canvien diversos factors alhora.&lt;/td&gt;&lt;td&gt;La massa és diferent. La forma i la mida són iguals en el muntatge del vídeo.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&lt;span class=&quot;key dep&quot;&gt;Què mirem?&lt;/span&gt;&lt;/th&gt;&lt;td&gt;Quin objecte arriba primer a terra.&lt;/td&gt;&lt;td&gt;Quin arriba primer o si arriben alhora.&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&lt;span class=&quot;key ctrl&quot;&gt;Què és igual?&lt;/span&gt;&lt;/th&gt;&lt;td&gt;La forma i la mida no es mantenen iguals entre pedra i ploma.&lt;/td&gt;&lt;td&gt;La forma esfèrica i la mida de les esferes.&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
      &lt;p&gt;&lt;strong&gt;Traduïm-ho al vocabulari científic:&lt;/strong&gt; la massa és la variable independent que volem estudiar; el temps de caiguda és la dependent. Al vídeo l’observem comparant l’arribada, sense mesurar segons.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Per fer una comparació controlada:&lt;/strong&gt; mateixa altura, mateix alliberament sense impuls, mateix lloc i sistema de mesura; mantenim forma i mida i considerem l’efecte de l’aire.&lt;/p&gt;
    &lt;/div&gt;
    &lt;details id=&quot;cs-q5b&quot; data-save&gt;
      &lt;summary&gt;5b · El primer experiment permetia treure conclusions?&lt;/summary&gt;
      &lt;div class=&quot;two&quot;&gt;
        &lt;div&gt;&lt;strong&gt;Què sí que observem?&lt;/strong&gt;&lt;p&gt;En aquesta prova, la pedra arriba abans que la ploma.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Què no podem justificar?&lt;/strong&gt;&lt;p&gt;Que la causa sigui la massa: també han canviat forma, mida i material. No hem aïllat el factor que volíem estudiar.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;answer lens&quot;&gt;&lt;strong&gt;No hi ha dues respostes contradictòries.&lt;/strong&gt; A la 4 expliquem que el vídeo ho interpreta com una confirmació. A la 5 analitzem la prova i veiem que no permet atribuir el resultat a la massa.&lt;/div&gt;
      &lt;p&gt;Les dues esferes milloren el control de forma i mida. Per generalitzar, encara cal repetir les proves i tenir en compte les condicions, especialment l’aire.&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section id=&quot;cs-scene-3&quot; aria-labelledby=&quot;cs-heading-3&quot; hidden&gt;
    &lt;div class=&quot;scene-heading&quot;&gt;&lt;h2 id=&quot;cs-heading-3&quot;&gt;4 · Canviem d’explicació&lt;/h2&gt;&lt;span class=&quot;viz-badge&quot;&gt;Fitxa 6&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;El cas d’Aristòtil i Galileu, tal com el presenta el vídeo.&lt;/p&gt;
    &lt;div class=&quot;timeline&quot;&gt;
      &lt;div class=&quot;era&quot;&gt;&lt;span class=&quot;text-small&quot;&gt;SEGLE IV aC&lt;/span&gt;&lt;h3&gt;Aristòtil&lt;/h3&gt;&lt;p&gt;Una idea acceptada durant segles.&lt;/p&gt;&lt;/div&gt;
      &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
      &lt;div class=&quot;era&quot;&gt;&lt;span class=&quot;text-small&quot;&gt;SEGLE XVII&lt;/span&gt;&lt;h3&gt;Galileu&lt;/h3&gt;&lt;p&gt;Una nova prova pot fer canviar l’explicació.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;details id=&quot;cs-q6a&quot; data-save&gt;
      &lt;summary&gt;6a · Quina idea antiga es canvia per quina de nova?&lt;/summary&gt;
      &lt;div class=&quot;two&quot;&gt;
        &lt;div&gt;&lt;strong&gt;Aristòtil · idea antiga&lt;/strong&gt;&lt;p&gt;Com més massa té un cos, més ràpid cau.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Galileu · idea nova&lt;/strong&gt;&lt;p&gt;Tots els cossos cauen amb la mateixa acceleració.&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;Precisió: al mateix lloc, en caiguda lliure i amb l’efecte de l’aire negligible.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/details&gt;
    &lt;details id=&quot;cs-q6b&quot; data-save&gt;
      &lt;summary&gt;6b · Per què va durar tant la idea antiga?&lt;/summary&gt;
      &lt;p&gt;Podem justificar la resposta amb alguna d’aquestes pistes del vídeo:&lt;/p&gt;
      &lt;div class=&quot;three&quot;&gt;
        &lt;div&gt;&lt;strong&gt;Autoritat&lt;/strong&gt;&lt;p&gt;Aristòtil era una figura molt reconeguda i es confiava en les seves idees.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Experiència quotidiana&lt;/strong&gt;&lt;p&gt;Algunes observacions, com pedra i ploma, semblaven donar-li la raó.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Posar-la a prova d’una altra manera&lt;/strong&gt;&lt;p&gt;El relat destaca el temps que passa fins que algú modifica la prova.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;&lt;strong&gt;Cal explicar la pista:&lt;/strong&gt; el prestigi o una observació aparentment favorable poden fer que una idea no es qüestioni.&lt;/p&gt;
    &lt;/details&gt;
    &lt;details id=&quot;cs-q6c&quot; data-save&gt;
      &lt;summary&gt;6c · Aristòtil podia seguir el mètode que presenta el vídeo?&lt;/summary&gt;
      &lt;p&gt;&lt;strong&gt;Segons la cronologia del vídeo, no:&lt;/strong&gt; situa el mètode al segle XVII, molt després d’Aristòtil. Una resposta raonada és que va arribar a la seva idea observant i raonant.&lt;/p&gt;
      &lt;p class=&quot;answer lens&quot;&gt;El vídeo explica retrospectivament el cas amb els passos del mètode. És una simplificació del relat; no demostra que Aristòtil fes aquests tres experiments.&lt;/p&gt;
    &lt;/details&gt;
    &lt;div class=&quot;q-label&quot;&gt;6d · Per què és important el que va fer Galileu?&lt;/div&gt;
    &lt;div class=&quot;choices&quot; id=&quot;cs-galileo-choices&quot;&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;radio&quot; name=&quot;cs-galileo&quot; value=&quot;0&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Perquè va acceptar les idees d’Aristòtil sense qüestionar-les.&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;radio&quot; name=&quot;cs-galileo&quot; value=&quot;1&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Perquè va qüestionar una idea acceptada durant segles i la va posar a prova amb experiments.&lt;/span&gt;&lt;/label&gt;
      &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;radio&quot; name=&quot;cs-galileo&quot; value=&quot;2&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Perquè va demostrar que totes les idees d’Aristòtil eren incorrectes.&lt;/span&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;button class=&quot;btn btn-primary&quot; id=&quot;cs-galileo-check&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;cs-galileo-answer&quot;&gt;Comprovar la 6d&lt;/button&gt;
    &lt;div class=&quot;answer&quot; id=&quot;cs-galileo-answer&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;La correcta és la segona.&lt;/strong&gt; Allò decisiu és qüestionar una idea i contrastar-la. Revisar una explicació concreta no refuta totes les idees d’una persona.&lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;cs-scene-4&quot; aria-labelledby=&quot;cs-heading-4&quot; hidden&gt;
    &lt;div class=&quot;scene-heading&quot;&gt;&lt;h2 id=&quot;cs-heading-4&quot;&gt;5 · Fins on podem estar segurs?&lt;/h2&gt;&lt;span class=&quot;viz-badge&quot;&gt;Fitxa 7 · 8.1 · 8.2&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;controls&quot; aria-label=&quot;Apartats de reflexió&quot;&gt;
      &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-reflection=&quot;0&quot; aria-pressed=&quot;true&quot;&gt;7 · Les sis afirmacions&lt;/button&gt;
      &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-reflection=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;8.1 · Dues frases&lt;/button&gt;
      &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-reflection=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;8.2 · Veritat definitiva?&lt;/button&gt;
    &lt;/div&gt;
    &lt;div id=&quot;cs-reflection-0&quot;&gt;
      &lt;p&gt;Marca les afirmacions correctes segons el vídeo i desplega’n la correcció.&lt;/p&gt;
      &lt;div id=&quot;cs-statements&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; id=&quot;cs-check-statements&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;cs-statements&quot;&gt;Corregir les sis afirmacions&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;answer&quot; id=&quot;cs-statements-summary&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;Correctes: 1, 5 i 6.&lt;/strong&gt; L’autoritat no substitueix les evidències i les explicacions es poden revisar.&lt;/div&gt;
      &lt;details id=&quot;cs-repeat&quot; data-save&gt;&lt;summary&gt;Un matís sobre «el mateix resultat»&lt;/summary&gt;&lt;p&gt;En repetir una investigació esperem resultats compatibles dins la precisió i la incertesa de les mesures. No cal que tots els números siguin exactament iguals.&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;div id=&quot;cs-reflection-1&quot; hidden&gt;
      &lt;div class=&quot;two&quot;&gt;
        &lt;blockquote&gt;&lt;p&gt;«Demostrada la hipótesis, podemos convertirla en Ley».&lt;/p&gt;&lt;span class=&quot;text-small&quot;&gt;Vídeo · 1:59&lt;/span&gt;&lt;/blockquote&gt;
        &lt;blockquote&gt;&lt;p&gt;«Ninguna ley es inmutable».&lt;/p&gt;&lt;span class=&quot;text-small&quot;&gt;Vídeo · 3:04&lt;/span&gt;&lt;/blockquote&gt;
      &lt;/div&gt;
      &lt;p&gt;&lt;strong&gt;Es contradiuen? Què deu voler dir «demostrada» aquí?&lt;/strong&gt;&lt;/p&gt;
      &lt;details id=&quot;cs-q81&quot; data-save&gt;
        &lt;summary&gt;Desplegar una resposta raonada · 8.1&lt;/summary&gt;
        &lt;p&gt;No necessàriament, si entenem «demostrada» com &lt;strong&gt;recolzada per les proves disponibles&lt;/strong&gt;, i no com una certesa absoluta i definitiva. La formulació del vídeo és massa simplificada.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;En el cas de la caiguda:&lt;/strong&gt; pedra i ploma semblaven donar suport a la primera idea, tot i que la prova no aïllava la massa. La ploma damunt la pedra la va qüestionar, i les esferes de masses diferents van donar suport a la nova explicació.&lt;/p&gt;
        &lt;div class=&quot;answer lens&quot;&gt;&lt;strong&gt;No hi ha un ascens automàtic de «hipòtesi» a «llei».&lt;/strong&gt; Una llei descriu una regularitat dins unes condicions. Una hipòtesi concreta pot explicar una prova sense originar cap llei: «una esfera s’ha deixat anar més tard».&lt;/div&gt;
      &lt;/details&gt;
      &lt;details id=&quot;cs-law-theory&quot; data-save&gt;
        &lt;summary&gt;Hipòtesi, llei i teoria: funcions diferents&lt;/summary&gt;
        &lt;div class=&quot;three&quot;&gt;&lt;div&gt;&lt;strong&gt;Hipòtesi&lt;/strong&gt;&lt;p&gt;Proposta provisional, justificada i contrastable amb dades.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Llei&lt;/strong&gt;&lt;p&gt;Descriu una regularitat de la natura en unes condicions determinades.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Teoria&lt;/strong&gt;&lt;p&gt;Marc explicatiu sostingut per moltes evidències, que integra models i lleis.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;p&gt;No són esglaons d’una escala: una teoria no es transforma en llei.&lt;/p&gt;
      &lt;/details&gt;
    &lt;/div&gt;
    &lt;div id=&quot;cs-reflection-2&quot; hidden&gt;
      &lt;div class=&quot;certainty&quot;&gt;&lt;span&gt;&lt;strong&gt;Proves repetides&lt;/strong&gt;&lt;br&gt;Resultats que podem contrastar&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Confiança justificada&lt;/strong&gt;&lt;br&gt;Amb condicions i límits&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Revisió si cal&lt;/strong&gt;&lt;br&gt;Davant evidències noves&lt;/span&gt;&lt;/div&gt;
      &lt;p&gt;&lt;strong&gt;La idea de Galileu és la veritat definitiva?&lt;/strong&gt; Connecta la resposta amb el canvi d’Aristòtil a Galileu.&lt;/p&gt;
      &lt;details id=&quot;cs-q82&quot; data-save&gt;
        &lt;summary&gt;Desplegar una resposta raonada · 8.2&lt;/summary&gt;
        &lt;p&gt;No tenim una garantia de veritat definitiva. &lt;strong&gt;Hi confiem perquè les proves li donen suport en les condicions en què s’aplica&lt;/strong&gt;, i altres persones poden repetir-les.&lt;/p&gt;
        &lt;p&gt;El canvi d’Aristòtil a Galileu mostra per què una idea acceptada ha de poder posar-se a prova. Si apareguessin resultats nous, fiables i repetits que no encaixessin, caldria revisar l’explicació o els seus límits.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;En aquest cas:&lt;/strong&gt; mateixa acceleració al mateix lloc, si només actua la gravetat i l’aire no frena de manera apreciable els cossos. Això no vol dir que qualsevol parell d’objectes, deixats anar de qualsevol manera, arribi alhora.&lt;/p&gt;
        &lt;div class=&quot;answer&quot;&gt;Poder revisar el coneixement no vol dir que qualsevol opinió valgui igual: les explicacions han de respondre a les evidències.&lt;/div&gt;
      &lt;/details&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;footer-nav&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;cs-prev&quot; type=&quot;button&quot; disabled&gt;← Escena anterior&lt;/button&gt;&lt;span class=&quot;text-small&quot; id=&quot;cs-position&quot;&gt;Escena 1 de 5&lt;/span&gt;&lt;button class=&quot;btn&quot; id=&quot;cs-next&quot; type=&quot;button&quot;&gt;Escena següent →&lt;/button&gt;&lt;/div&gt;
  &lt;hr&gt;
  &lt;details id=&quot;cs-more&quot; class=&quot;extension&quot; data-save&gt;
    &lt;summary&gt;Per saber-ne més · Aire, acceleració i gravetat&lt;/summary&gt;
    &lt;p&gt;Aprofundiment per a qui vulgui investigar més enllà de la correcció.&lt;/p&gt;
    &lt;details id=&quot;cs-air&quot; data-save&gt;
      &lt;summary&gt;1 · Què canvia si traiem l’aire?&lt;/summary&gt;
      &lt;p&gt;Prediu què passarà amb una pedra i una ploma deixades anar alhora, des del repòs i de la mateixa altura.&lt;/p&gt;
      &lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-air=&quot;0&quot; aria-pressed=&quot;true&quot;&gt;Amb aire&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-air=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;Sense aire&lt;/button&gt;&lt;/div&gt;
      &lt;p id=&quot;cs-air-result&quot; class=&quot;answer&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;text-small&quot;&gt;És una comparació conceptual; no és una mesura ni una simulació a escala.&lt;/p&gt;
    &lt;/details&gt;
    &lt;details id=&quot;cs-acceleration&quot; data-save&gt;
      &lt;summary&gt;2 · Mateixa acceleració vol dir velocitat constant?&lt;/summary&gt;
      &lt;p&gt;Les marques representen posicions separades per &lt;strong&gt;intervals de temps iguals&lt;/strong&gt;. Quina seqüència mostra una velocitat que augmenta?&lt;/p&gt;
      &lt;div class=&quot;trajectory&quot;&gt;
        &lt;div&gt;&lt;strong&gt;Seqüència A&lt;/strong&gt;&lt;div class=&quot;track&quot; aria-label=&quot;Quatre posicions amb separacions iguals&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;top:0&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot; style=&quot;top:45px&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot; style=&quot;top:90px&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot; style=&quot;top:135px&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-motion=&quot;0&quot;&gt;Triar A&lt;/button&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Seqüència B&lt;/strong&gt;&lt;div class=&quot;track&quot; aria-label=&quot;Quatre posicions amb separacions cada vegada més grans&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;top:0&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot; style=&quot;top:15px&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot; style=&quot;top:60px&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dot&quot; style=&quot;top:135px&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-motion=&quot;1&quot;&gt;Triar B&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;answer&quot; id=&quot;cs-motion-answer&quot; aria-live=&quot;polite&quot; hidden&gt;&lt;/p&gt;
    &lt;/details&gt;
    &lt;details id=&quot;cs-newton&quot; data-save&gt;
      &lt;summary&gt;3 · De Galileu a Newton: per què la massa no canvia l’acceleració?&lt;/summary&gt;
      &lt;p&gt;&lt;strong&gt;Galileu · segle XVII, 1638.&lt;/strong&gt; Els &lt;em&gt;Discorsi&lt;/em&gt; recullen els seus estudis del moviment.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Newton · segle XVII, 1687.&lt;/strong&gt; Els &lt;em&gt;Principia&lt;/em&gt; relacionen les lleis del moviment i la gravitació. Són dates de publicació.&lt;/p&gt;
      &lt;div class=&quot;two&quot;&gt;&lt;div&gt;&lt;strong&gt;Més massa → més força gravitatòria&lt;/strong&gt;&lt;p&gt;Al mateix lloc, la Terra atrau amb més força el cos de més massa.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Més massa → més inèrcia&lt;/strong&gt;&lt;p&gt;També costa més canviar el moviment d’aquest cos.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;answer&quot;&gt;En caiguda lliure, aquests dos efectes es compensen: al mateix lloc l’acceleració és la mateixa, independentment de la massa.&lt;/p&gt;
      &lt;p&gt;Si portem el mateix objecte a la Lluna, &lt;strong&gt;la seva massa es manté&lt;/strong&gt;; canvien l’atracció gravitatòria i l’acceleració de caiguda. La Lluna també té gravetat.&lt;/p&gt;
    &lt;/details&gt;
    &lt;details id=&quot;cs-apollo&quot; data-save&gt;
      &lt;summary&gt;4 · Repte: investiguem l’Apollo 15&lt;/summary&gt;
      &lt;p&gt;&lt;strong&gt;Un martell i una ploma a la Lluna.&lt;/strong&gt; Abans de mirar la prova, fes una predicció.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://science.nasa.gov/resource/the-apollo-15-hammer-feather-drop-2/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Obrir la prova real de l’Apollo 15 · NASA&lt;/a&gt;&lt;/p&gt;
      &lt;ol&gt;&lt;li&gt;Què observes quan els deixen anar alhora des de la mateixa altura?&lt;/li&gt;&lt;li&gt;Per què passa? Quin paper hi tenen l’aire i la gravetat?&lt;/li&gt;&lt;li&gt;Podria passar també a la Terra? En quines condicions?&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;Justifica la resposta amb una font fiable i assenyala quina observació l’avala.&lt;/p&gt;
      &lt;details id=&quot;cs-apollo-answer&quot; data-save&gt;&lt;summary&gt;Contrastar l’explicació, després d’investigar&lt;/summary&gt;&lt;p&gt;Arriben pràcticament alhora. La Lluna té gravetat, però gairebé no té atmosfera que els freni de manera diferent. A la Terra també passa en el buit, amb el mateix alliberament i altura. L’acceleració és menor a la Lluna que a la Terra, però en cada lloc és la mateixa per als dos objectes.&lt;/p&gt;&lt;/details&gt;
    &lt;/details&gt;
  &lt;/details&gt;
  &lt;details id=&quot;cs-sources&quot; class=&quot;sources&quot; data-save&gt;
    &lt;summary&gt;Vídeo i fonts per aprofundir&lt;/summary&gt;
    &lt;div class=&quot;source-links&quot;&gt;
      &lt;a href=&quot;https://www.youtube.com/watch?v=Nwe7M71Fqxo&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;QuantumFracture · ¿Qué es la Ciencia?&lt;/a&gt;
      &lt;a href=&quot;https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/free-falling-objects/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;NASA · Caiguda lliure&lt;/a&gt;
